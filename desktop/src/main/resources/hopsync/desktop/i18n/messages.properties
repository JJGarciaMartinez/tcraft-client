# User-facing text (Spanish). Placeholders follow java.text.MessageFormat.

# Why a sync step failed, with what the player can do about it
failure.notConfigured=No hay ningún pack configurado. Elige uno en Ajustes.
failure.invalidUrl=El enlace del pack debe empezar por https:// ({0}).
failure.network=No se pudo conectar con {0}. Revisa tu conexión y vuelve a intentarlo.
failure.httpStatus.notFound=No hay ningún pack en ese enlace (error {0}). Revisa el enlace en Ajustes.
failure.httpStatus.forbidden=El servidor no permite descargar el pack (error {0}). Avisa a quien lo publica.
failure.httpStatus.server=El servidor del pack no responde bien (error {0}). Vuelve a intentarlo más tarde.
failure.httpStatus.other=El servidor rechazó la descarga (error {0}).
failure.responseTooLarge=Ese enlace no apunta a un pack de HopSync: la respuesta es demasiado grande.
failure.manifestInvalid=El pack tiene un formato no válido. Avisa a quien lo publica. Detalle: {0}
failure.unsupportedFormat=El pack usa un formato más nuevo ({0}) del que entiende esta versión de HopSync ({1}). Actualiza HopSync.
failure.hashMismatch=El archivo {0} no coincide con el pack; puede haberse dañado al descargarlo. Vuelve a intentarlo.
failure.sizeMismatch=El archivo {0} no tiene el tamaño esperado. Vuelve a intentarlo.
failure.unsafePath=El pack intenta escribir fuera de la carpeta del juego ({0}). Se ha bloqueado por seguridad.
failure.folderUnavailable=No se pudo crear la carpeta {0}. Comprueba que tienes permiso para escribir en ella.
failure.folderInUse=Otra copia de HopSync está actualizando esta carpeta. Espera a que termine.
failure.folderUsedByPack=Esta carpeta ya la usa {0}. Cada pack necesita su propia carpeta o instancia.
failure.diskFull=No queda espacio en el disco para guardar {0}. Libera espacio y vuelve a intentarlo.
failure.fileLocked=No se pudo reemplazar {0} porque está en uso. Cierra Minecraft y vuelve a intentarlo.
failure.permissionDenied=No tienes permiso para escribir en {0}.
failure.unexpected=Algo salió mal. El archivo de registro tiene los detalles.

