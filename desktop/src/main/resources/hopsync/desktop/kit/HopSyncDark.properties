# HopSync dark theme, loaded by FlatLaf on top of FlatDarkLaf.properties because it sits next to
# HopSyncDark.class. Elevation: raised = press, sunken = type or choose, flat = information.

#---- Palette ----

@background = #141618
@foreground = #ECEEEB
@accentColor = #5DBB63
@disabledForeground = #6A7277

HopSync.background = @background
HopSync.surface = #1B1E21
HopSync.well = #0C0E0F
HopSync.edge = #3B4147
HopSync.text = @foreground
HopSync.textSecondary = #9AA1A6
HopSync.textFaint = #6A7277
HopSync.accent = @accentColor
HopSync.added = #6AA6FF
HopSync.update = #F0B44C
HopSync.error = #EE6B6B
HopSync.focus = #A6E3AA

Label.disabledForeground = @disabledForeground
Separator.foreground = $HopSync.edge
Component.borderColor = $HopSync.edge
Component.disabledBorderColor = #2A2E32
TextComponent.selectAllOnFocusPolicy = never

#---- Font ----

# Relative sizes keep FlatLaf's scale factor, which it derives from the system font size. Windows starts
# at 12 and macOS at 13; Linux follows the desktop font setting.
[win]defaultFont = +1

#---- Shape and focus ----

Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
Component.focusWidth = 3
Component.innerFocusWidth = 0
Component.focusColor = fade($HopSync.focus,40%)
Component.focusedBorderColor = @accentColor

#---- Raised: buttons (painted by RaisedButtonUI) ----

# Height of the darker strip under the face; the face drops onto it while pressed
HopSync.bevelWidth = 2
HopSync.bevel = #08090A
HopSync.bevel.primary = #2A5F2F
HopSync.bevel.danger = #6E2A2A
HopSync.highlight = fade(#FFFFFF,9%)

Button.borderWidth = 0
Button.default.borderWidth = 0
Button.margin = 6,16,6,16
Button.background = #30353A
Button.hoverBackground = #383E44
Button.pressedBackground = #2B3034
Button.foreground = @foreground
Button.disabledBackground = #1F2225
Button.disabledText = @disabledForeground
Button.default.background = @accentColor
Button.default.foreground = #0B1A0C
Button.default.hoverBackground = lighten(@accentColor,5%)
Button.default.pressedBackground = darken(@accentColor,4%)
Button.default.boldText = true

[style]Button.primary = background: @accentColor; foreground: #0B1A0C; hoverBackground: lighten(@accentColor,5%); pressedBackground: darken(@accentColor,4%)
[style]Button.danger = background: #B54848; foreground: #FFFFFF; hoverBackground: #C25252; pressedBackground: #A84242
[style]Button.small = margin: 3,10,3,10; font: -1

#---- Sunken: text fields (border painted by SunkenBorder) ----

HopSync.innerShadow = fade(#000000,55%)

TextField.background = $HopSync.well
FormattedTextField.background = $HopSync.well
PasswordField.background = $HopSync.well
TextField.inactiveBackground = $HopSync.well
FormattedTextField.inactiveBackground = $HopSync.well
PasswordField.inactiveBackground = $HopSync.well

#---- Flat: progress ----

ProgressBar.arc = 8
ProgressBar.background = $HopSync.well
ProgressBar.foreground = @accentColor
ProgressBar.selectionForeground = #0B1A0C
ProgressBar.selectionBackground = @foreground
